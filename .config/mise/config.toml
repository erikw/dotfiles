[tools]
go = "latest"
gradle = "latest"
java = "latest"
kotlin = "latest"
node = "latest"
python = "latest"
ruby = "latest"


[settings]
# Compatibility usage of .python-verion, .ruby-version, .nvmrc etc.
idiomatic_version_file_enable_tools = ["go", "node", "python", "ruby"]

[settings.python]
compile = false

[settings.ruby]
compile = false
